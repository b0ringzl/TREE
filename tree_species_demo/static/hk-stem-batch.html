<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榕树树干返工 · 批量返工</title>
<style>body{max-width:1400px;margin:24px auto;padding:0 20px;background:#f3f6f0;color:#203e31;font:15px/1.6 system-ui}h1{font-size:26px}a{color:#256347}button,select,input{font:inherit;padding:10px;border:1px solid #bed0c0;border-radius:7px;background:white}button{cursor:pointer}button:disabled{opacity:.4}nav,.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.notice{background:#fff1cf;padding:14px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border-radius:10px;padding:12px}.wide{grid-column:1/-1}img{width:100%;display:block}.bar input{flex:1}small{color:#65746a}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>榕树树干返工 · 批量返工</h1><nav><a href="/hk-stem-pilot">已验收的小样（保留原记录）</a><a href="/hk-pairs">原版双源验收</a><a href="/">识别 Demo</a></nav>
<p class="notice">本页是独立返工版本，不覆盖原版及原审核。橙色点为重新提取的冠下候选，不是已确认树干。所有新增点来自实测雷达缓存，没有补造点。本轮尚未认证任何一棵为完整树体。</p>
<p id="summary">载入中…</p><div class="bar"><label><input type="checkbox" id="all">也显示自动阻断和助手预检返工项</label><button id="prev">上一棵</button><select id="item"></select><button id="next">下一棵</button></div>
<h2 id="title"></h2><p id="meta"></p><p id="qa" class="notice"></p>
<div class="grid"><section class="card"><b>原版 · 高度分层预览</b><img id="before"></section><section class="card"><b>返工版 · 高度分层预览</b><img id="after"><p id="blocked" hidden>未生成可靠基干—树冠连接，保持返工，不制造补全点。</p></section><section class="card wide"><b>重新提取的冠下点投影</b><img id="projection"></section><section class="card wide"><details><summary>查看未覆盖的原始全景</summary><img id="panorama"></details></section></div>
<div id="links" class="bar"></div><div class="bar"><input id="note" placeholder="请注明：仍缺干、混背景、邻树或可以使用"><button id="accept">接受这份返工数据</button><button id="reject">仍需返工</button><button id="pending">待定</button></div><p id="status" role="status"></p><small>接受只保存对本返工版本的人工判断，不自动训练，不改原版标签或退回记录。上方助手预检不等于人工验收。</small>
<script>
const $=id=>document.getElementById(id);let data=[],items=[],current='',busy=false;
async function api(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求失败');return d}
function filter(){items=data.filter(r=>$('all').checked||r.agent_qa?.disposition==='review_candidate');$('item').replaceChildren(...items.map(r=>new Option(r.id,r.id)));if(items.some(r=>r.id===current))$('item').value=current;if(items.length)show($('item').value)}
function show(id){current=id;const r=items.find(r=>r.id===id),ok=r.status==='candidate_requires_review';$('title').textContent=r.id;$('meta').textContent=`原冠下点 ${r.old_trunk_points} → ${r.new_trunk_points??'未恢复'}；独立采样 ${r.sample_unique_points??'无'}；可用地图缓存 ${r.source_map_count} 个。点数增加不等于完整率提高。`;$('qa').textContent=r.agent_qa?.note||'自动检查未通过：未找到足够可靠的基干到树冠路径。';for(const name of ['before','after','projection','panorama']){const visible=ok||['before','panorama'].includes(name);$(name).hidden=!visible;if(visible)$(name).src=`/hk-stem-batch-file/${id}/${name}.jpg`;else $(name).removeAttribute('src')}$('blocked').hidden=ok;for(const n of ['accept','reject','pending'])$(n).disabled=!ok||busy;$('note').value=r.review?.note||'';$('status').textContent=r.review?'本版本已保存：'+r.review.decision:'';$('links').replaceChildren();for(const n of ok?['point.npz','cleaned_local.npz','report.json']:['report.json']){const a=document.createElement('a');a.href=`/hk-stem-batch-file/${id}/${n}`;a.textContent=n;a.download=n;$('links').append(a)}for(const other of r.nearby_view_ids){const a=document.createElement('a');a.href=`/hk-pair-file/${other}/projection.jpg`;a.target='_blank';a.rel='noopener';a.textContent='邻近视角（同木待确认） '+other;$('links').append(a)}}
function move(d){const i=items.findIndex(r=>r.id===current);if(items.length){$('item').value=items[(i+d+items.length)%items.length].id;show($('item').value)}}
async function save(decision){if(busy)return;busy=true;for(const n of ['accept','reject','pending'])$(n).disabled=true;const id=current;try{const d=await api(`/api/hk-stem-batch/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,species:'榕树',note:$('note').value})});data.find(r=>r.id===id).review=d.review;$('status').textContent='已保存本返工版本：'+decision}catch(e){$('status').textContent='未保存：'+e.message}finally{busy=false;for(const n of ['accept','reject','pending'])$(n).disabled=items.find(r=>r.id===current)?.status!=='candidate_requires_review'}}
$('all').onchange=filter;$('item').onchange=()=>show($('item').value);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);for(const n of ['accept','reject','pending'])$(n).onclick=()=>save(n);
api('/api/hk-stem-batch').then(d=>{data=d.items;const count=data.filter(r=>r.agent_qa?.disposition==='review_candidate').length;$('summary').textContent=`共 ${data.length} 个跨帧实例：${count} 项供优先复核，其余保留失败/返工记录。默认仅显示这 ${count} 项，减轻验收负担。`;filter()}).catch(e=>$('summary').textContent=e.message);
</script></html>
