<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>香港五类扩展 · 双源验收</title>
<style>body{font:16px system-ui;margin:28px auto;max-width:1200px;background:#f3f6f1;color:#20392b;padding:0 20px}button,select,textarea{font:inherit;padding:9px;margin:5px}article{background:white;padding:18px;border-radius:12px;margin:16px 0}img{max-width:100%;display:block;margin:12px auto}textarea{width:90%}.warn{color:#9a4b12}#message{white-space:pre-wrap}a{color:#24674c}</style>
<h1>五类扩展 · 图像与实测单木点云</h1><a href="/hk-pairs">返回原三类验收</a> · <a href="/hk-label-conflicts">银合欢 / 大叶合欢冲突复核</a>
<p>凤凰木、石栗、银合欢、大叶合欢、南洋杉（原训练合并类）。新增审核独立保存，不更改原标注或已验收三类数据。</p>
<p class="warn">点云通过几何筛选不代表树种或配准已确认。垂直跨度不是完整树高；不生成补洞点。南洋杉保留原始学名，银合欢尚无当前图像模型输出类。</p>
<div id="message">正在读取处理结果…</div>
<select id="filter"></select><label><input id="all" type="checkbox">显示全部几何候选（含未预检和需返工）</label>
<button id="refresh">刷新</button><div><button id="prev">上一棵</button><select id="item"></select><button id="next">下一棵</button></div>
<article id="detail" hidden><h2 id="title"></h2><p id="info"></p><p id="qa"></p><img id="projection"><img id="views"><details><summary>影像裁切</summary><img id="crop"></details><p><a id="download">下载轻量点云</a> · <a id="record">下载追溯记录</a></p>
<p>轻量单木：拖动旋转，滚轮缩放</p><canvas id="cloud" style="width:100%;height:360px;background:#edf3ec;touch-action:none"></canvas><p id="model"></p>
<label>验收树种 <select id="species"></select></label><br><textarea id="note" placeholder="树干、树冠、邻树混入或树种修正备注"></textarea><br>
<button data-decision="accept">接受并进入下一棵</button><button data-decision="reject">退回并进入下一棵</button><button data-decision="pending">保存待定</button><span id="saved"></span></article>
<script>
const $=id=>document.getElementById(id),names={'Delonix regia':'凤凰木','Aleurites moluccana':'石栗','Leucaena leucocephala':'银合欢','Albizia lebbeck':'大叶合欢','Araucaria columnaris(Araucaria heterophylla)':'南洋杉（原训练合并类）',Unknown:'未知'};
let data=[],shown=[];for(const [v,n] of Object.entries(names))$('species').add(new Option(n,v));$('filter').add(new Option('全部树种',''));for(const [v,n] of Object.entries(names))if(v!=='Unknown')$('filter').add(new Option(n,v));
async function load(){try{const res=await fetch('/api/hk-expansion');if(!res.ok)throw Error(await res.text());const r=await res.json();data=r.items;$('message').textContent=`已记录 ${data.length} 项；几何候选 ${data.filter(x=>x.status==='geometry_candidate_pending_review').length} 项。${r.summary.processing?'仍在处理，稍后刷新。':''}`;filter()}catch(e){$('message').textContent='载入失败：'+e.message}}
function filter(){shown=data.filter(r=>r.status==='geometry_candidate_pending_review'&&(!$('filter').value||r.species===$('filter').value)&&($('all').checked||r.agent_qa?.disposition==='review_candidate'));$('item').replaceChildren(...shown.map(r=>new Option(`${names[r.species]||r.species} · ${r.id} · ${r.review?.decision||'未验收'}`,r.id)));show()}
function show(){const r=shown[$('item').selectedIndex];$('detail').hidden=!r;if(!r){$('saved').textContent='';return}const b='/hk-expansion-file/'+encodeURIComponent(r.id)+'/';$('title').textContent=names[r.species]||r.species;$('info').textContent=`原标签：${r.original_species||r.species}；独立采样 ${r.quality?.sample_unique_points} 点；观测垂直跨度 ${r.quality?.extent_m?.[2]?.toFixed(2)} 米（不是已验证整树高）。`;$('qa').textContent=r.agent_qa?.note||'尚未完成图像与点云联合预检，请勿把自动候选当成合格样本';$('projection').src=b+'projection.jpg';$('views').src=b+'point_views.jpg';$('crop').src=b+'image.jpg';$('download').href=b+'point.npz';$('record').href=b+'record.json';$('species').value=r.review?.species||r.species;$('note').value=r.review?.note||'';$('saved').textContent=r.review?'已保存：'+r.review.decision:''}
function move(d){$('item').selectedIndex=Math.max(0,Math.min(shown.length-1,$('item').selectedIndex+d));show()}
let points=[],yaw=0,pitch=.1,zoom=1,requestId=0;const showStatic=show;
show=function(){showStatic();const r=shown[$('item').selectedIndex],token=++requestId;points=[];draw();if(!r)return;const e=r.image_evidence;$('model').textContent=e?(e.model_has_target_class?`现有图像模型首选：${names[e.top1]||e.top1}，分数 ${(e.score*100).toFixed(1)}%（未校准，不等于正确率）。${e.label_agreement?'与原标签一致。':'与原标签冲突，需复核。'}`:'当前图像模型没有该树种输出类；不能提供该类有效置信度。'):'图像模型证据尚未生成';fetch('/api/hk-expansion/'+encodeURIComponent(r.id)+'/preview').then(async res=>{if(!res.ok)throw Error('点云预览读取失败');return res.json()}).then(v=>{if(token===requestId){points=v.points;draw()}}).catch(e=>{if(token===requestId)$('saved').textContent=e.message})};
function draw(){const c=$('cloud'),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const s=Math.min(c.width,c.height)*.43*zoom;for(const [x,y,z] of points){const a=x*Math.cos(yaw)-y*Math.sin(yaw),b=(x*Math.sin(yaw)+y*Math.cos(yaw))*Math.sin(pitch)-z*Math.cos(pitch);ctx.fillStyle=`hsl(${130+z*25} 40% ${37+z*10}%)`;ctx.fillRect(c.width/2+a*s,c.height/2+b*s,2*devicePixelRatio,2*devicePixelRatio)}}
let drag=null;$('cloud').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('cloud').setPointerCapture(e.pointerId)};$('cloud').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()}};$('cloud').onpointerup=$('cloud').onpointercancel=()=>drag=null;$('cloud').onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom-e.deltaY*.001));draw()};window.addEventListener('resize',draw);
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('item').onchange=show;$('filter').onchange=filter;$('all').onchange=filter;$('refresh').onclick=load;
for(const btn of document.querySelectorAll('[data-decision]'))btn.onclick=async()=>{const r=shown[$('item').selectedIndex];if(!r)return;const buttons=[...document.querySelectorAll('[data-decision]')];buttons.forEach(x=>x.disabled=true);try{const res=await fetch('/api/hk-expansion/'+encodeURIComponent(r.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:btn.dataset.decision,species:$('species').value,note:$('note').value})});if(!res.ok)throw Error(await res.text());const out=await res.json();r.review=out.review;show();if(btn.dataset.decision!=='pending'&&$('item').selectedIndex<shown.length-1)move(1);$('saved').textContent='上一操作已保存：'+names[r.species]+' / '+out.review.decision}catch(e){$('saved').textContent='未保存：'+e.message}finally{buttons.forEach(x=>x.disabled=false)}};load();
</script></html>
