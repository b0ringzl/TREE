<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港单木 · 双源验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f0;color:#203e31;font:14px/1.6 system-ui,'Microsoft YaHei'}header,main{max-width:1450px;margin:auto;padding:22px}h1{margin:0;font-size:25px}a{color:#256347}button,select,input{font:inherit;padding:9px;border:1px solid #c4d5c6;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.notice{padding:12px;background:#fff2d5;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #d7e2d7;padding:15px;border-radius:12px}.wide{grid-column:1/-1}img{width:100%;display:block;border-radius:5px}#projection{max-height:570px;object-fit:contain;background:#19271e}canvas{width:100%;height:390px;background:#edf3ec;touch-action:none}#views{height:390px;object-fit:contain}small{color:#6c7c70}#accept{background:#287650;color:white}#reject{background:#fff0e9}#note{min-width:250px;flex:1}.status{min-height:26px}#experiment{font-size:12px}label{white-space:nowrap}@media(max-width:850px){.grid{grid-template-columns:1fr}header,main{padding:14px}.wide{grid-column:auto}}</style>
<header><div class="bar"><h1>香港单木 · 图像与点云验收</h1><a href="/">返回识别 Demo</a><button id="refresh">刷新进度</button></div><div id="summary">读取处理结果…</div><p class="notice">这里是由人工图像标注定位出的三维候选，不是自动判为“验收通过”。请检查是否同木、是否混入建筑/邻树、树冠树干是否完整。保存只写本次双源审核，不改原全景标签。</p></header>
<main><div class="bar"><label>类别 <select id="filter"><option value="">全部三类</option></select></label><label><input id="dedup" type="checkbox" checked> 每个单木组显示一个较好视角</label><label><input id="pending" type="checkbox" checked> 只看待验收</label><span id="count"></span></div><div class="bar"><button id="prev">上一棵</button><select id="item" style="flex:1;min-width:240px"></select><button id="next">下一棵</button></div><div id="empty" class="notice" hidden>当前筛选无候选。若仍在处理，请稍后点击“刷新进度”。</div><section id="detail" class="grid" hidden><div class="card wide"><b id="title"></b><div id="meta"></div><img id="projection" alt="原图及点云投影"></div><div class="card"><b>2048点以内的轻量单木 · 拖动旋转 / 滚轮缩放</b><canvas id="cloud"></canvas></div><div class="card"><b>清洗后全量单木 · XZ / YZ / XY</b><img id="views" alt="点云三视图"></div><div class="card wide"><div class="bar"><label>验收树种 <select id="species"></select></label><input id="note" placeholder="可选：缺冠、断干、混入邻树、投影错位等"><button id="accept">接受并下一棵</button><button id="reject">退回并下一棵</button><button id="defer">保持待定并下一棵</button></div><div id="status" class="status" role="status"></div><small>接受表示你确认当前这对图像与点云及所选树种可用；不是仅确认“看起来是树”。同组其他视角不会被自动接受。</small><div id="downloads" class="bar"></div></div></section><div id="experiment" class="card" style="margin-top:16px"></div></main>
<script>
const $=id=>document.getElementById(id);let data,items=[],current='',points=[],yaw=.4,pitch=.1,zoom=1,busy=false,requestId=0;
const pilotLink=document.createElement('a');pilotLink.href='/hk-stem-pilot';pilotLink.textContent='榕树树干返工 · 10棵对比';document.querySelector('header .bar').append(pilotLink);
const batchLink=document.createElement('a');batchLink.href='/hk-stem-batch';batchLink.textContent='榕树批量返工验收';document.querySelector('header .bar').append(batchLink);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function heightText(m){if(!m)return '米制高度尚未审计';let t=`已观测垂直跨度 ${m.observed_vertical_span_m.toFixed(2)} m（残缺时不等于整树高）`;if(Number.isFinite(m.estimated_tree_height_m)){t+=`；局部地面参照估高 ${m.estimated_tree_height_m.toFixed(2)} m（根颈、冠顶未确认）`;if(Number.isFinite(m.bottom_ground_gap_m))t+=`；最低点距拟合地面 ${m.bottom_ground_gap_m.toFixed(2)} m`;t+=m.height_feature_eligible?'；可进入研究性高度分支，非完整性认证':'；疑缺基干/地面不匹配，不作为可靠树高'}else t+='；地面未可靠定位，暂不估算整树高';return t}
async function api(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function load(){try{data=await api('/api/hk-pairs');const s=data.summary;$('summary').textContent=s.processing?`仍在处理：已处理 ${s.processed||s.input_annotations||0} 条，当前可查看 ${data.items.length} 对候选。`:`首轮处理 ${s.input_annotations} 个跨帧实例 · 待复核 ${data.items.length} 对 · 初步单木组 ${s.candidate_tree_groups} · 另有 ${s.status?.needs_geometry_refinement||0} 对已标记返工`;if(!$('filter').dataset.ready){for(const name of data.classes){$('filter').add(new Option(name,name));$('species').add(new Option(name,name))}$('filter').dataset.ready='1'}$('experiment').textContent=data.experiment?`三类迁移实验已训练，留出 ${data.experiment.heldout_pairs} 对并设置25米空间缓冲。参考标签仍为待验收转移标签，不代表真实识别精度；蒲葵点云单源仍需重点核查。`:'三类双源模型尚在准备，当前验收数据不会自动触发训练。';filter()}catch(e){$('summary').textContent=e.message}}
function filter(){let list=data.items.filter(r=>(!$('filter').value||r.species===$('filter').value)&&(!$('pending').checked||!r.review||r.review.decision==='pending'));list.sort((a,b)=>(b.quality?.trunk_bin_occupancy||0)-(a.quality?.trunk_bin_occupancy||0)||(b.quality?.clean_points||0)-(a.quality?.clean_points||0));if($('dedup').checked){const seen=new Set();list=list.filter(r=>{const k=r.tree_group||r.id;if(seen.has(k))return false;seen.add(k);return true})}items=list;$('count').textContent=`当前 ${items.length} 项 / 全部 ${data.items.length} 个跨帧候选`;$('item').innerHTML=items.map(r=>`<option value="${esc(r.id)}">${esc(r.species)} · ${esc(r.id)}${r.group_label_conflict?' · 同组标签冲突':''}</option>`).join('');if(items.some(r=>r.id===current))$('item').value=current;$('empty').hidden=!!items.length;$('detail').hidden=!items.length;if(items.length)show($('item').value)}
async function show(id){current=id;const token=++requestId;const r=items.find(r=>r.id===id);if(!r)return;points=[];draw();$('title').textContent=`${r.species} · ${r.frame_key}`;$('meta').textContent=`单木组 ${r.tree_group||'处理中'}；清洗点 ${r.quality.clean_points}；独立采样 ${r.quality.sample_unique_points}；干高分箱有点比例 ${(r.quality.trunk_bin_occupancy*100).toFixed(0)}%（不是完整率）。${heightText(r.metric_height)}`;$('projection').src=`/hk-pair-file/${id}/projection.jpg`;$('views').src=`/hk-pair-file/${id}/${r.metric_height?'height_views.jpg':'point_views.jpg'}`;$('views').previousElementSibling.textContent='全量数据的高度分层预览 · 棕色为冠下部分（不是树干真值）';$('species').value=r.review?.species||r.species;$('note').value=r.review?.note||'';$('status').textContent=r.group_label_conflict?'同组出现不同树种标签，务必检查是否错配或混合树。':'';$('downloads').innerHTML=['image.jpg','point.npz','cleaned_local.npz','record.json'].map(n=>`<a href="/hk-pair-file/${id}/${n}" download>${n}</a>`).join('');if(r.stem_repair?.status==='repair_candidate_requires_review'){$('downloads').innerHTML+='<span>另版树干返工预览（当前接受/退回按钮仍针对原版）：</span>'+['before.jpg','after.jpg','projection.jpg','point.npz','report.json'].map(n=>`<a href="/hk-stem-repair/${id}/${n}" target="_blank" rel="noopener">返工 ${n}</a>`).join('')}else if(r.stem_repair){$('downloads').innerHTML+='<span>树干返工受阻：未能可靠定位局部地面，保留退回状态。</span>'}try{const d=await api(`/api/hk-pairs/${id}/preview`);if(token!==requestId)return;points=d.points;draw()}catch(e){$('status').textContent=e.message}}
function move(delta){const index=items.findIndex(r=>r.id===current);const next=items[(index+delta+items.length)%items.length];if(next){$('item').value=next.id;show(next.id)}}
async function save(decision){if(busy||!current)return;busy=true;for(const id of ['accept','reject','defer'])$(id).disabled=true;const id=current;const i=items.findIndex(r=>r.id===id);const next=items[i+1]?.id||items[0]?.id;try{const d=await api(`/api/hk-pairs/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,species:$('species').value,note:$('note').value})});data.items.find(r=>r.id===id).review=d.review;current=next;filter();$('status').textContent='已保存上一棵：'+decision}catch(e){$('status').textContent='未保存：'+e.message}finally{busy=false;for(const id of ['accept','reject','defer'])$(id).disabled=false}}
function draw(){const c=$('cloud'),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const s=Math.min(c.width,c.height)*.43*zoom;for(const [x,y,z] of points){const a=x*Math.cos(yaw)-y*Math.sin(yaw),b=(x*Math.sin(yaw)+y*Math.cos(yaw))*Math.sin(pitch)-z*Math.cos(pitch);ctx.fillStyle=`hsl(${130+z*25} 40% ${37+z*10}%)`;ctx.fillRect(c.width/2+a*s,c.height/2+b*s,2*devicePixelRatio,2*devicePixelRatio)}}
let drag=null;$('cloud').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('cloud').setPointerCapture(e.pointerId)};$('cloud').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()}};$('cloud').onpointerup=()=>drag=null;$('cloud').onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom-e.deltaY*.001));draw()};window.onresize=draw;
$('refresh').onclick=load;$('item').onchange=()=>show($('item').value);for(const id of ['filter','dedup','pending'])$(id).onchange=filter;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('accept').onclick=()=>save('accept');$('reject').onclick=()=>save('reject');$('defer').onclick=()=>save('pending');load();
</script></html>
