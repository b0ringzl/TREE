<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>凤凰木单木重提取验收</title>
<style>body{font:16px system-ui;max-width:1450px;margin:24px auto;padding:0 20px;background:#f2f5ef;color:#203b2c}button,select,textarea{font:inherit;padding:9px;margin:5px}article{padding:18px;background:white;border-radius:12px}img{width:100%;object-fit:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%;height:350px;background:#edf4ed;touch-action:none}.warn{background:#fff0d0;padding:14px}textarea{width:95%;min-height:65px}#status{white-space:pre-wrap}a{color:#216747}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>凤凰木：新版单木清洗结果</h1><p><a href="/hk-delonix">原全景核查</a> · <a href="/hk-expansion">原五类配对</a> · <button id="refresh">刷新</button><span id="count"></span></p>
<p class="warn">这里只包含你确认“凤凰木＋点云对应正确”的 11 个目标。新版独立验收，不覆盖以前的接受记录。橙色为冠下候选点，不是树干真值；找到冠下路径也不等于根部已完整。未启动训练。</p>
<label><input type="checkbox" id="includeRework">包含待返工目标（4 个）</label><br><button id="prev">上一棵</button><select id="item"></select><button id="next">下一棵</button>
<article id="detail" hidden><h2 id="title"></h2><p id="info"></p><p id="qa"></p><img id="projection"><a id="large" target="_blank" rel="noopener">放大全景投影</a>
<div class="grid"><div><h3>此前提取三视图</h3><p id="noOld" hidden>此前没有成功生成单木点云</p><img id="before"></div><div><h3>新版清洗三视图</h3><img id="after"></div></div>
<p>轻量点云：拖动旋转 / 滚轮缩放</p><canvas id="cloud"></canvas><p><a id="download">下载 2048 点以内点云</a> · <a id="record">追溯记录</a></p><textarea id="note" placeholder="新版仍有哪些问题，或是否适合只利用树冠"></textarea><br>
<button data-d="accept">接受新版并下一棵</button><button data-d="reject">退回新版并下一棵</button><button data-d="pending">保存待定</button><p id="status" role="status"></p></article>
<script>
const $=x=>document.getElementById(x);let allItems=[],items=[],points=[],yaw=0,pitch=.1,zoom=1,token=0,busy=false;const current=()=>items[$('item').selectedIndex];
function filterItems(){const old=current()?.id;items=allItems.filter(x=>$('includeRework').checked||x.agent_qa?.status!=='needs_rework');$('count').textContent=`处理 ${allItems.length} 个，当前展示 ${items.length} 个；本版已保存 ${allItems.filter(x=>x.pair_review&&x.pair_review.decision!=='pending').length} 个`;$('item').replaceChildren(...items.map(x=>new Option((x.agent_qa?.status==='needs_rework'?'⚠ 待返工 ':x.priority_by_user?'★ 重点 ':'')+x.frame_key+' · '+x.id.split('__').at(-1),x.id)));if(items.some(x=>x.id===old))$('item').value=old;show()}
async function load(){try{const r=await fetch('/api/hk-delonix-refined');if(!r.ok)throw Error(await r.text());allItems=(await r.json()).items;filterItems()}catch(e){$('count').textContent=e.message}}
$('includeRework').onchange=()=>{if(busy){$('includeRework').checked=!$('includeRework').checked;return}filterItems()};
async function show(){const r=current(),id=++token;points=[];draw();$('detail').hidden=!r;if(!r)return;const b='/hk-delonix-refined-file/'+encodeURIComponent(r.id)+'/';$('title').textContent=r.id;const q=r.quality;$('info').textContent=q?`清洗点 ${q.clean_points}；独立采样 ${q.sample_unique_points}；${q.stem_path_found?'发现冠下连接路径，根部未验证':'仅保留冠部：未找到可靠冠干连接'}；观测垂直跨度 ${q.observed_extent_m[2].toFixed(2)} m（不是整树高）。`:'提取受阻：'+r.reason;$('qa').textContent=r.agent_qa?.note||'新版尚待逐例核查';$('projection').src=b+(q?'projection.jpg':'panorama.jpg');$('large').href=$('projection').src;$('before').hidden=!r.has_previous;$('noOld').hidden=r.has_previous;if(r.has_previous)$('before').src=b+'before_views.jpg';$('after').hidden=!q;if(q)$('after').src=b+'point_views.jpg';$('download').hidden=!q;$('download').href=b+'point.npz';$('record').href=b+'record.json';$('note').value=r.pair_review?.note||'';$('status').textContent=r.pair_review?'本版已保存：'+r.pair_review.decision:'';for(const btn of document.querySelectorAll('[data-d]'))btn.disabled=!q;if(q)try{const res=await fetch('/api/hk-delonix-refined/'+encodeURIComponent(r.id)+'/preview');if(!res.ok)throw Error('预览读取失败');const p=await res.json();if(id===token){points=p.points;draw()}}catch(e){if(id===token)$('status').textContent=e.message}}
function move(d){if(busy)return;$('item').selectedIndex=Math.max(0,Math.min(items.length-1,$('item').selectedIndex+d));show()}
function draw(){const c=$('cloud'),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const s=Math.min(c.width,c.height)*.43*zoom;ctx.fillStyle='#2e7753';for(const [x,y,z] of points){const a=x*Math.cos(yaw)-y*Math.sin(yaw),b=(x*Math.sin(yaw)+y*Math.cos(yaw))*Math.sin(pitch)-z*Math.cos(pitch);ctx.fillRect(c.width/2+a*s,c.height/2+b*s,2*devicePixelRatio,2*devicePixelRatio)}}
let drag=null;$('cloud').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('cloud').setPointerCapture(e.pointerId)};$('cloud').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()}};$('cloud').onpointerup=$('cloud').onpointercancel=()=>drag=null;$('cloud').onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom-e.deltaY*.001));draw()};window.addEventListener('resize',draw);
for(const btn of document.querySelectorAll('[data-d]'))btn.onclick=async()=>{if(busy)return;const r=current();busy=true;for(const x of ['item','prev','next','refresh'])$(x).disabled=true;for(const b of document.querySelectorAll('[data-d]'))b.disabled=true;try{const res=await fetch('/api/hk-delonix-refined/'+encodeURIComponent(r.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:btn.dataset.d,note:$('note').value})});if(!res.ok)throw Error(await res.text());r.pair_review=(await res.json()).review;if(btn.dataset.d!=='pending'&&$('item').selectedIndex<items.length-1)$('item').selectedIndex++;await show();$('status').textContent='已保存上一操作：'+r.id+' / '+r.pair_review.decision}catch(e){$('status').textContent='未保存：'+e.message}finally{busy=false;for(const x of ['item','prev','next','refresh'])$(x).disabled=false;for(const b of document.querySelectorAll('[data-d]'))b.disabled=current()?.status!=='candidate_pending_review'}};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('item').onchange=show;$('refresh').onclick=load;load();
</script></html>
