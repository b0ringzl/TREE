<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>凤凰木 · 全景与点云核查</title>
<style>body{font:16px system-ui;margin:22px auto;max-width:1500px;padding:0 20px;background:#f2f5ef;color:#213c30}button,select,input,textarea{font:inherit;padding:9px;margin:5px}button{cursor:pointer}article{background:#fff;padding:16px;border-radius:12px}img{width:100%;display:block;background:#102318}textarea{width:95%;min-height:60px}.warn{padding:12px;background:#fff0d2}#status{white-space:pre-wrap}#previous{white-space:pre-wrap}a{color:#276748}details{margin:12px 0}</style>
<h1>凤凰木：全部已知全景场景与实测点云投影</h1><p><a href="/hk-expansion">五类验收</a> · <a href="/hk-delonix-refined">新版凤凰木单木验收</a> · <button id="refresh">刷新进度</button><span id="count"></span></p>
<p class="warn">这里核对“是不是凤凰木”和“点云是否对应目标”，不自动接受为完整单木。彩色点只是落在标签区域的原始测量点，可能含背景；蓝色点为其他场景点。未跳过失败场景，未按 15 米抽帧。既有验收记录保持不动。</p>
<div><button id="prev">上一景</button><select id="scene"></select><button id="next">下一景</button></div>
<article id="detail" hidden><h2 id="title"></h2><p id="meta"></p><div><select id="mode"><option value="target_projection.jpg">标签区域的原始点云投影</option><option value="scene_projection.jpg">整幅全景点云投影</option><option value="labels.jpg">仅原图和标签</option><option value="panorama.jpg">原始全景</option><option value="previous_cleaned_projection.jpg">此前单木提取结果对照</option></select><a id="large" target="_blank" rel="noopener">放大当前图</a> · <a id="record" target="_blank">来源记录</a></div>
<img id="picture" alt="全景及点云投影"><p>图中 T1、T2 等分别对应下方目标；同一景包含多棵时请逐棵核对。</p>
<label>当前目标 <select id="target"></select></label><p id="previous"></p>
<label>树种 <select id="identification"><option value="">请选择</option><option value="delonix">确认是凤凰木</option><option value="not_delonix">不是凤凰木</option><option value="uncertain">树种待定</option></select></label>
<label>点云对应 <select id="alignment"><option value="">请选择</option><option value="aligned">与目标对应</option><option value="offset">投影错位 / 匹配错树</option><option value="background">背景或邻树混入</option><option value="incomplete">目标点云缺失 / 不完整</option><option value="uncertain">暂不能判断</option></select></label><br>
<input id="corrected" placeholder="不是凤凰木时，可选填实际树种" disabled><br><textarea id="note" placeholder="备注：哪部分错位、缺失或混入背景"></textarea><br>
<button id="save">保存当前目标</button><button id="saveNext">保存并下一个目标 / 场景</button><p id="status" role="status"></p>
</article>
<script>
const $=x=>document.getElementById(x);let data=[],reviews={},busy=false;
const now=()=>data[$('scene').selectedIndex],target=()=>now()?.targets[$('target').selectedIndex];
async function load(){try{const res=await fetch('/api/hk-delonix');if(!res.ok)throw Error(await res.text());const r=await res.json();data=r.items;reviews=r.reviews;$('count').textContent=`${data.length} 张全景 / ${data.reduce((n,x)=>n+x.targets.length,0)} 个目标；本轮已核对 ${Object.keys(reviews).length} 个${r.summary.processing?'（仍在生成）':''}`;$('scene').replaceChildren(...data.map(x=>new Option(x.id+' · '+x.targets.length+' 个目标',x.id)));show()}catch(e){$('count').textContent='读取失败：'+e.message}}
function show(){const r=now();$('detail').hidden=!r;if(!r)return;$('title').textContent=r.id;$('meta').textContent=`原始邻域实测点 ${r.measured_nearby_points??'不可用'}；源点保留尺度 ${r.source_sampling_m??'?'} m。${r.reason||''}`;$('target').replaceChildren(...r.targets.map((t,i)=>new Option('T'+(i+1)+' · '+t.id,t.id)));for(const o of $('mode').options)o.disabled=(o.value==='previous_cleaned_projection.jpg'&&!r.has_previous_cleaned_projection)||(r.status!=='ready'&&o.value.includes('projection'));if($('mode').selectedOptions[0].disabled)$('mode').value='labels.jpg';view();showTarget()}
function view(){const r=now();if(!r)return;const b='/hk-delonix-file/'+encodeURIComponent(r.id)+'/';$('picture').src=b+$('mode').value;$('large').href=$('picture').src;$('record').href=b+'record.json'}
function showTarget(){const t=target();if(!t)return;const r=reviews[t.id];$('previous').textContent=`原标签：${t.original_species}；此前配对状态：${t.previous_pair_status||'未提取'}${t.previous_pair_reason?' / '+t.previous_pair_reason:''}。\n此前验收：${t.previous_review?.decision||'没有'}${t.previous_review?.note?' / '+t.previous_review.note:''}（只读，本页不会覆盖）。`;$('identification').value=r?.identification||'';$('alignment').value=r?.alignment||'';$('corrected').value=r?.corrected_species||'';$('corrected').disabled=$('identification').value!=='not_delonix';$('note').value=r?.note||'';$('status').textContent=r?'本轮已保存此目标':''}
function move(d){if(busy)return;$('scene').selectedIndex=Math.max(0,Math.min(data.length-1,$('scene').selectedIndex+d));show()}
function nextTarget(){if($('target').selectedIndex<now().targets.length-1){$('target').selectedIndex++;showTarget()}else if($('scene').selectedIndex<data.length-1){$('scene').selectedIndex++;show()}}
async function save(next){const s=now(),t=target();if(busy||!t)return;if(!$('identification').value||!$('alignment').value){$('status').textContent='请分别选择树种判断和点云对应情况';return}busy=true;for(const x of ['save','saveNext','scene','target','prev','next','refresh'])$(x).disabled=true;try{const res=await fetch('/api/hk-delonix/'+encodeURIComponent(s.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_id:t.id,identification:$('identification').value,alignment:$('alignment').value,corrected_species:$('corrected').value,note:$('note').value})});if(!res.ok)throw Error(await res.text());const r=await res.json();reviews[t.id]=r.review;if(next)nextTarget();$('status').textContent='已保存：'+t.id;$('count').textContent=`${data.length} 张全景 / ${data.reduce((n,x)=>n+x.targets.length,0)} 个目标；本轮已核对 ${Object.keys(reviews).length} 个`}catch(e){$('status').textContent='未保存：'+e.message}finally{busy=false;for(const x of ['save','saveNext','scene','target','prev','next','refresh'])$(x).disabled=false}}
$('refresh').onclick=load;$('scene').onchange=show;$('target').onchange=showTarget;$('mode').onchange=view;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('save').onclick=()=>save(false);$('saveNext').onclick=()=>save(true);$('identification').onchange=()=>{$('corrected').disabled=$('identification').value!=='not_delonix';if($('corrected').disabled)$('corrected').value=''};$('picture').onerror=()=>{$('status').textContent='当前图像读取失败，请切换原图或刷新进度'};load();
</script></html>
