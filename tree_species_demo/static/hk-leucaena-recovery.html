<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>银合欢补样与身份核查</title>
<style>body{font:16px system-ui;max-width:1450px;margin:24px auto;padding:0 20px;background:#f2f5ef;color:#203b2c}button,select,textarea{font:inherit;padding:9px;margin:5px}article{padding:18px;background:white;border-radius:12px}img{width:100%;object-fit:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.warn{background:#fff0d0;padding:14px}textarea{width:95%;min-height:65px}#message{white-space:pre-wrap}a{color:#216747}canvas{width:100%;height:330px;background:#edf4ed;touch-action:none}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>银合欢：补样与关联树身份核查</h1><p><a href="/hk-label-conflicts">已保存的同树裁决</a> · <a href="/hk-expansion">原五类验收</a></p>
<p class="warn">4276、4287 已按你的裁决记为同一棵大叶合欢；原审核不变。当前已接受银合欢仅 1 个。此次尝试 7 个剩余目标，无完整树干恢复成功。默认只展示 2 个需你核查的项目，其他 5 个待返工可展开。没有自动接受或训练。</p>
<label><input id="all" type="checkbox">显示全部待返工</label><span id="count"></span><br><button id="prev">上一项</button><select id="item"></select><button id="next">下一项</button>
<article id="detail" hidden><h2 id="title"></h2><p class="warn" id="qa"></p><p id="info"></p><a id="large" target="_blank" rel="noopener">放大全景投影</a><img id="projection"><div class="grid"><div><h3>新版三视图</h3><img id="after"></div><div><h3>原版三视图（存在时）</h3><img id="before"></div></div><canvas id="cloud"></canvas><p>拖动旋转 / 滚轮缩放；点云是局部观测，不代表完整树体。</p><details><summary>原始影像裁切</summary><img id="crop"></details><p><a id="download">下载轻量实测点云</a> · <a id="record" target="_blank">追溯记录</a></p>
<label>树种<select id="species"><option value="Unknown">待定</option><option value="Leucaena leucocephala">银合欢</option><option value="Albizia lebbeck">大叶合欢</option></select></label><label id="referenceLabel">与已裁决大叶合欢的关系<select id="identity"><option value="uncertain">待定</option><option value="same_adjudicated_tree">同一棵树</option><option value="unrelated">不同树</option></select></label><br><textarea id="note" placeholder="局部树冠是否有用、是否混入邻树；树种改正和点云质量分开保存"></textarea><br><button data-d="accept">接受局部配对并下一项</button><button data-d="reject">退回并下一项</button><button data-d="pending">保存待定</button><p id="message" role="status"></p></article>
<script>
const $=x=>document.getElementById(x);let all=[],items=[],busy=false,stale=false,points=[],token=0,yaw=0,pitch=.1,zoom=1;const current=()=>items[$('item').selectedIndex];
async function load(){try{const r=await fetch('/api/hk-leucaena-recovery');if(!r.ok)throw Error(await r.text());const d=await r.json();all=d.items;stale=d.source_changed;filter()}catch(e){$('count').textContent=e.message}}
function filter(){const old=current()?.id;items=all.filter(r=>$('all').checked||r.agent_qa?.status!=='needs_rework');$('item').replaceChildren(...items.map(r=>new Option(r.frame_key+' · '+r.id.split('__').at(-1),r.id)));if(items.some(r=>r.id===old))$('item').value=old;show()}
async function show(){const r=current(),t=++token;points=[];draw();$('detail').hidden=!r;if(!r)return;const b='/hk-leucaena-recovery-file/'+encodeURIComponent(r.id)+'/',q=r.quality;$('count').textContent=`当前 ${items.length} / 全部 ${all.length}；本版已审核 ${all.filter(x=>x.review&&x.review.decision!=='pending').length}`;$('title').textContent=r.id;$('qa').textContent=r.agent_qa?.note||'';$('info').textContent=q?`清洗 ${q.clean_points} 点，独立采样 ${q.sample_unique_points} 点；观测垂直跨度 ${q.observed_extent_m[2].toFixed(2)} m（非树高），没有可靠冠干连接。`:'未提取成功：'+r.reason;$('projection').src=b+(q?'projection.jpg':'label.jpg');$('large').href=$('projection').src;$('after').hidden=!q;if(q)$('after').src=b+'point_views.jpg';$('before').hidden=!r.has_previous;if(r.has_previous)$('before').src=b+'before_views.jpg';$('crop').src=b+'image.jpg';$('download').hidden=!q;$('download').href=b+'point.npz';$('record').href=b+'record.json';$('species').value=r.review?.species||'Unknown';$('identity').value=r.review?.reference_identity||'uncertain';$('referenceLabel').hidden=!r.conflicting_reference_links?.length;$('note').value=r.review?.note||'';$('message').textContent=stale?'源审核已变更，本版暂不可提交':r.review?'已保存：'+r.review.decision:'';buttons();if(q)try{const res=await fetch('/api/hk-leucaena-recovery/'+encodeURIComponent(r.id)+'/preview');if(!res.ok)throw Error('点云预览读取失败');const d=await res.json();if(t===token){points=d.points;draw()}}catch(e){if(t===token)$('message').textContent=e.message}}
function buttons(){for(const b of document.querySelectorAll('[data-d]'))b.disabled=busy||stale||(b.dataset.d==='accept'&&!current()?.quality)}
function move(d){if(busy)return;$('item').selectedIndex=Math.max(0,Math.min(items.length-1,$('item').selectedIndex+d));show()}
for(const b of document.querySelectorAll('[data-d]'))b.onclick=async()=>{if(busy)return;const r=current();busy=true;buttons();for(const id of ['item','prev','next','all'])$(id).disabled=true;try{const response=await fetch('/api/hk-leucaena-recovery/'+encodeURIComponent(r.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:b.dataset.d,species:$('species').value,reference_identity:$('identity').value,note:$('note').value})});if(!response.ok)throw Error(await response.text());r.review=(await response.json()).review;if(b.dataset.d!=='pending'&&$('item').selectedIndex<items.length-1)$('item').selectedIndex++;await show();$('message').textContent='已保存：'+r.id+' / '+r.review.decision}catch(e){$('message').textContent='未保存：'+e.message}finally{busy=false;for(const id of ['item','prev','next','all'])$(id).disabled=false;buttons()}};
function draw(){const c=$('cloud'),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const s=Math.min(c.width,c.height)*.43*zoom;ctx.fillStyle='#2e7753';for(const [x,y,z] of points){const a=x*Math.cos(yaw)-y*Math.sin(yaw),b=(x*Math.sin(yaw)+y*Math.cos(yaw))*Math.sin(pitch)-z*Math.cos(pitch);ctx.fillRect(c.width/2+a*s,c.height/2+b*s,2*devicePixelRatio,2*devicePixelRatio)}}
let drag=null;$('cloud').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('cloud').setPointerCapture(e.pointerId)};$('cloud').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()}};$('cloud').onpointerup=$('cloud').onpointercancel=()=>drag=null;$('cloud').onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom-e.deltaY*.001));draw()};window.addEventListener('resize',draw);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('item').onchange=show;$('all').onchange=filter;load();
</script></html>
