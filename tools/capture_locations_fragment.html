<div id="capture-locations-five">
<style>
#capture-locations-five{color:var(--foreground)}
#capture-locations-five .scene{margin:0 0 24px}#capture-locations-five canvas{display:block;width:100%;height:440px;touch-action:none}#capture-locations-five .scene-title{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin:12px 0}#capture-locations-five .scene-title strong{font-weight:500}#capture-locations-five .controls{margin:8px 0}#capture-locations-five .caption{margin:8px 0}@media(max-width:480px){#capture-locations-five canvas{height:340px}}
</style>
<div class="text-small caption">拖動旋轉 · 滾輪縮放 · Shift＋拖動平移／右鍵拖動平移 · 顏色：相對高度，非樹種</div>
<div class="scenes"></div>
<script type="application/json" id="capture-locations-data">__SCENE_DATA__</script>
<script>
(()=>{const root=document.getElementById('capture-locations-five'),data=JSON.parse(root.querySelector('#capture-locations-data').textContent),states=[];
function element(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function paint(s){const canvas=s.canvas,w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const cs=getComputedStyle(root),fg=cs.getPropertyValue('--foreground').trim()||getComputedStyle(root).color;const colors=['--viz-series-1','--viz-series-2','--viz-series-3'].map(v=>cs.getPropertyValue(v).trim()||fg);const ca=Math.cos(s.yaw),sa=Math.sin(s.yaw),cp=Math.cos(s.pitch),sp=Math.sin(s.pitch);const projected=[];let xmin=Infinity,xmax=-Infinity,zmin=Infinity,zmax=-Infinity;for(let i=0;i<s.points.length;i+=3){let x=s.points[i]*s.r.step+s.r.min[0]-s.r.center[0],y=s.points[i+1]*s.r.step+s.r.min[1]-s.r.center[1],z=s.points[i+2]*s.r.step+s.r.min[2]-s.r.center[2],a=x*ca-y*sa,b=x*sa+y*ca,v=z*cp-b*sp;projected.push([a,v,b*cp+z*sp,(z+s.r.center[2]-s.r.min[2])/Math.max(s.r.extent[2],.01)]);xmin=Math.min(xmin,a);xmax=Math.max(xmax,a);zmin=Math.min(zmin,v);zmax=Math.max(zmax,v)}const scale=Math.min(w*.90/Math.max(xmax-xmin,1),h*.80/Math.max(zmax-zmin,1))*s.zoom,bx=(xmin+xmax)/2,bz=(zmin+zmax)/2;projected.sort((a,b)=>a[2]-b[2]);ctx.globalAlpha=.85;for(const [x,z,depth,height] of projected){let px=w/2+s.pan[0]+(x-bx)*scale,py=h/2+s.pan[1]-(z-bz)*scale;if(px<0||px>w||py<0||py>h)continue;ctx.fillStyle=colors[Math.min(2,Math.floor(height*3))];ctx.fillRect(px,py,1.5,1.5)}ctx.globalAlpha=1;ctx.fillStyle=fg;ctx.font=getComputedStyle(root).font;let metres=Math.pow(10,Math.floor(Math.log10(100/scale)));if(metres*scale<35)metres*=5;const length=metres*scale;ctx.fillRect(18,h-22,length,1);ctx.fillRect(18,h-25,1,7);ctx.fillRect(18+length,h-25,1,7);ctx.fillText(metres+' m',18,h-32)}
for(const r of data){const section=element('section',null,'scene'),title=element('div',null,'scene-title');title.append(element('strong',r.id),element('span',`約 ${r.extent[0].toFixed(0)} × ${r.extent[1].toFixed(0)} m（本地 XY 範圍）`,'text-small'));section.append(title);const canvas=element('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',r.id+' 全場景點雲，可拖動旋轉');canvas.textContent=r.id+'：完整場景的實測點雲抽樣預覽，保留建築道路。';section.append(canvas);const controls=element('div',null,'viz-controls controls');section.append(controls);root.querySelector('.scenes').append(section);const raw=atob(r.encoded),buffer=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)buffer[i]=raw.charCodeAt(i);const s={r,canvas,points:new Uint16Array(buffer.buffer),yaw:.6,pitch:.52,zoom:1,pan:[0,0],drag:null};states.push(s);for(const [name,yaw,pitch] of [['斜視',.6,.52],['俯視',0,Math.PI/2],['正視',0,0],['側視',Math.PI/2,0]]){let b=element('button',name,'btn');b.type='button';b.onclick=()=>{s.yaw=yaw;s.pitch=pitch;s.zoom=1;s.pan=[0,0];paint(s)};controls.append(b)}canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{s.drag=[e.clientX,e.clientY,e.shiftKey||e.button===2];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!s.drag)return;let dx=e.clientX-s.drag[0],dy=e.clientY-s.drag[1];if(s.drag[2]){s.pan[0]+=dx;s.pan[1]+=dy}else{s.yaw+=dx*.008;s.pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,s.pitch+dy*.008))}s.drag=[e.clientX,e.clientY,s.drag[2]];paint(s)};canvas.onpointerup=canvas.onpointercancel=()=>s.drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();s.zoom=Math.max(.3,Math.min(12,s.zoom*Math.exp(-e.deltaY*.0015)));paint(s)},{passive:false});new ResizeObserver(()=>paint(s)).observe(canvas);paint(s)}new MutationObserver(()=>states.forEach(paint)).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});})();
</script>
</div>
